<title>TVB · Retour d'entraînement</title>

<style>
:root{--navy:#0e1e3d;--blue:#2c56a0;--gold:#c9a66b;--bg:#f3f5f9;--line:#dfe4ee;--txt:#1b2540;--mut:#6b7690;--red:#c94a40;--amber:#e09a2b;--green:#3fae7a}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt)}
.wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
.hd{background:var(--navy);color:#fff;padding:18px 18px 16px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px}
.hd img{width:46px;height:46px;border-radius:50%;background:#fff1;object-fit:contain}
.hd small{color:var(--gold);letter-spacing:2px;font-size:10px;font-weight:700;display:block}
.hd h1{margin:3px 0 0;font-size:21px;letter-spacing:.4px}
.hd .bar{position:absolute;right:-10px;top:0;bottom:0;width:70px;background:linear-gradient(105deg,transparent 40%,var(--gold) 41%,var(--gold) 47%,var(--blue) 48%)}
.sec{padding:14px 16px 0}
.lab{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:1px;margin:0 0 6px}
.row{display:flex;gap:10px;margin-bottom:14px}
.row>div{flex:1;min-width:0}
input[type=date],select,input[type=text],textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--txt);appearance:none;-webkit-appearance:none}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:11px 0;font-size:14px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--txt)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.h2{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:15px;margin:8px 0 10px}
.h2 b{background:var(--gold);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph{display:grid;grid-template-columns:1fr 52px 52px 52px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);font-size:14px}
.ph.head{background:var(--navy);color:#fff;font-size:9.5px;font-weight:700;text-align:center;border:0;line-height:1.2}
.ph.head div:first-child{text-align:left}
